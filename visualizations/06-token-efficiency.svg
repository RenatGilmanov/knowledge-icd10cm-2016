<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2640 1920" width="2640" height="1920" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Token efficiency, measured. — ICD-10-CM April 2026</title><desc id="figure-desc">All 809,979 canonical facts, compared in three equivalent representations. Full corpus; all 41 complete category files. Savings compare identical seven-field canonical fact content, including evidence and qualifiers.</desc><rect x="0" y="0" width="2640" height="1920" rx="0" fill="#F5F4EF" stroke="#F5F4EF" stroke-width="1.4"></rect><text x="80" y="64" font-size="18" fill="#13796F" font-weight="700" text-anchor="start" letter-spacing="1.6">FREEFACT / TOKEN EFFECTIVENESS / APRIL 2026</text><text x="2560" y="64" font-size="22" fill="#617380" font-weight="400" text-anchor="end">01 / 03</text><text x="80" y="150" font-size="64" fill="#173044" font-weight="700" text-anchor="start">Token efficiency, measured.</text><text x="80" y="203" font-size="27" fill="#617380" font-weight="400" text-anchor="start"><tspan x="80" dy="0">All 809,979 canonical facts, compared in three equivalent representations.</tspan></text><line x1="80" y1="1840" x2="2560" y2="1840" stroke="#D2DBDC" stroke-width="1.5"></line><text x="80" y="1877" font-size="18" fill="#617380" font-weight="400" text-anchor="start">cl100k_base  •  Measured serialization cost  •  LLM answer quality is not evaluated</text><text x="2560" y="1877" font-size="18" fill="#617380" font-weight="400" text-anchor="end">FREEFACT / 06-token-efficiency</text><rect x="80" y="265" width="585" height="180" rx="12" fill="#FFFFFF" stroke="#D2DBDC" stroke-width="1.4"></rect><text x="105" y="300" font-size="18" fill="#13796F" font-weight="700" text-anchor="start" letter-spacing="1.6">DELIVERED FFL 3 TOKENS</text><text x="105" y="366" font-size="48" fill="#13796F" font-weight="700" text-anchor="start" data-metric="totals.ffl3_tokens" data-value="23719770"